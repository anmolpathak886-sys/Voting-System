<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voting System</title>
    
   
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="card">
        <h2>Voting System</h2>

        <div class="candidate">
            <h3>Candidate A</h3>
            <p id="countA" class="count">0</p>
            <button id="voteA"><i class="fa-solid fa-check"></i> Vote</button>
        </div>

        <div class="candidate">
            <h3>Candidate B</h3>
            <p id="countB" class="count">0</p>
            <button id="voteB"><i class="fa-solid fa-check"></i> Vote</button>
        </div>

        <div class="result">
            <h3 id="winner">No votes yet</h3>
            <button id="resetBtn"><i class="fa-solid fa-rotate-right"></i> Reset Election</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
